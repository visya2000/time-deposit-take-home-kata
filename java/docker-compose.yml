# Local PostgreSQL for running the application: docker compose up -d
# Keep the image in sync with TestcontainersConfiguration.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: time_deposits
      POSTGRES_USER: time_deposits
      POSTGRES_PASSWORD: time_deposits
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
