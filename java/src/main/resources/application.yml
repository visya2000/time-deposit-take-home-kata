interest:
  # Zone in which business dates (e.g. when interest was last applied) are computed.
  business-zone: UTC
  update:
    # Deposits locked and updated per transaction by the balance update.
    chunk-size: 500

# The datasource is configured per environment (SPRING_DATASOURCE_* variables, or the local
# profile); tests use Testcontainers.
spring:
  jpa:
    # Do not hold a DB connection for the whole HTTP request; lazy loads outside the adapter fail fast.
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          batch_size: ${interest.update.chunk-size}  # one JDBC batch per balance-update chunk
        order_updates: true
        query:
          # Never paginate a fetch join in memory (loads every row); fail instead.
          fail_on_pagination_over_collection_fetch: true
